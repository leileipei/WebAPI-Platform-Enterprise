receivers:
  otlp:
    protocols:
      grpc: {endpoint: "0.0.0.0:4317"}
      http: {endpoint: "0.0.0.0:4318"}
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 128
    spike_limit_mib: 32
  batch:
    timeout: 1s
    send_batch_size: 512
    send_batch_max_size: 512
exporters:
  prometheus:
    endpoint: "0.0.0.0:8889"
    metric_expiration: 2m
    resource_constant_labels:
      included: [service.name, service.instance.id, webapi.environment.id]
  otlp_http/loki:
    endpoint: "http://loki:3100/otlp"
    timeout: 5s
    retry_on_failure: {enabled: true, initial_interval: 1s, max_interval: 5s, max_elapsed_time: 30s}
    sending_queue: {enabled: true, queue_size: 1024, num_consumers: 2}
  otlp_grpc/tempo:
    endpoint: "tempo:4317"
    tls: {insecure: true}
    timeout: 5s
    retry_on_failure: {enabled: true, initial_interval: 1s, max_interval: 5s, max_elapsed_time: 30s}
    sending_queue: {enabled: true, queue_size: 1024, num_consumers: 2}
extensions:
  health_check: {endpoint: "0.0.0.0:13133"}
service:
  extensions: [health_check]
  pipelines:
    metrics: {receivers: [otlp], processors: [memory_limiter, batch], exporters: [prometheus]}
    logs: {receivers: [otlp], processors: [memory_limiter, batch], exporters: [otlp_http/loki]}
    traces: {receivers: [otlp], processors: [memory_limiter, batch], exporters: [otlp_grpc/tempo]}
