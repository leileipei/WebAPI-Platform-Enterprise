name: Console CI

'on':
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  console:
    name: console
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test local diagnostic helpers
        run: python3 -B -m unittest discover -s tests/local_diagnostics -p 'test_*.py' -v

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
          package-manager-cache: false

      - name: Test acceptance runners and restore safeguards
        run: >-
          node --test
          tests/contracts/runner.test.mjs
          tests/runtime/restore-storage-budget.test.mjs
          tests/runtime/restore-quota-provider.test.mjs
          tests/runtime/migration-evidence-inspection.test.mjs
          tests/runtime/acceptance-context.test.mjs
          tests/runtime/project-counts-acceptance-guards.test.mjs
          tests/runtime/core-e2e-cleanup.test.mjs
          tests/runtime/acceptance-credentials.test.mjs
          tests/runtime/comparison-runner.test.mjs
          tests/runtime/comparison-cleanup.test.mjs
          tests/runtime/comparison-scenario.test.mjs
          tests/runtime/settings-runner.test.mjs
          tests/runtime/settings-cleanup.test.mjs
          tests/runtime/policy-cleanup.test.mjs
          tests/runtime/sso-credential-cleanup.test.mjs
          tests/runtime/sso-package-entry.test.mjs
          tests/runtime/observability-fixture.test.mjs
          tests/runtime/observability-scenario.test.mjs

      - name: Install pnpm
        run: npm install --global pnpm@11.25.0 --ignore-scripts --no-audit --no-fund

      - name: Test core package CLI
        run: python3 -B -m unittest discover -s tests/packaging -v

      - name: Install locked dependencies
        run: pnpm --dir console install --frozen-lockfile

      - name: Test and build console
        run: bash scripts/check-console.sh

      - name: Install pinned browser test tools
        run: |
          npm install --prefix "$RUNNER_TEMP/webapi-browser" --no-save --ignore-scripts --no-audit --no-fund playwright@1.62.1
          "$RUNNER_TEMP/webapi-browser/node_modules/.bin/playwright" install --with-deps chromium

      - name: Test all browser flows against the production build
        run: WEBAPI_PLAYWRIGHT_PACKAGE="$RUNNER_TEMP/webapi-browser/node_modules/playwright/package.json" node scripts/check-console-browser.mjs
